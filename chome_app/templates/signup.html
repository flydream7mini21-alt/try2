<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            width: 380px;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #bbb;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            border: none;
            background: #2c3e50;
            color: white;
        }

        .gen-btn {
            background: #4caf50;
        }

        .password-wrapper {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .password-wrapper input {
            flex: 1;
        }

        .eye-btn {
            margin-left: 8px;
            padding: 8px 12px;
            background: #555;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>新規登録</h2>

    <form method="POST">
        {% csrf_token %}

        <label>ユーザー名</label>
        <input type="text" name="username" required>

        <label>名前</label>
        <input type="text" name="full_name" required>

        <label>メールアドレス</label>
        <input type="email" name="email" required>

        <label>パスワード</label>
        <div class="password-wrapper">
            <input type="password" id="passwordField" name="password1" required>
            <div class="eye-btn" onclick="togglePassword()">👁 表示</div>
        </div>

        <label>パスワード（確認）</label>
        <input type="password" name="password2" required>

        <button type="button" class="gen-btn" onclick="generatePassword()">
            パスワード自動生成
        </button>

        <button type="submit">登録</button>
    </form>
</div>

<script>
function generatePassword() {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
    let pass = "";
    for (let i = 0; i < 12; i++) {
        pass += chars[Math.floor(Math.random() * chars.length)];
    }
    document.getElementById("passwordField").value = pass;
}

function togglePassword() {
    const field = document.getElementById("passwordField");
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
